<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow Pro</title><link rel="stylesheet" href="styles.css"></head><body><main><nav><strong>◈ TASKFLOW <small>PRO</small></strong><span>ESPACIO PERSONAL</span></nav><header><div class="eyebrow">PRODUCTIVIDAD / PANEL GENERAL</div><h1>Haz que suceda<span>.</span></h1><p>Organiza tus pendientes. Un objetivo a la vez.</p></header><section class="stats" aria-label="Estadísticas"><article>Total<strong id="total">0</strong></article><article>Pendientes<strong id="pending">0</strong></article><article>Completadas<strong id="completed">0</strong></article></section><section class="panel"><div class="between"><h2>Tu progreso</h2><strong id="percent">0%</strong></div><progress id="progress" max="100" value="0"></progress></section><section class="panel"><h2 id="formtitle">Nueva tarea</h2><form id="form"><label for="name">Nombre de la tarea</label><div class="entry"><input id="name" maxlength="200" placeholder="¿Qué necesitas hacer?" autocomplete="off"><select id="priority" aria-label="Prioridad"><option>Normal</option><option>Alta</option><option>Baja</option></select><button id="submit">＋ Agregar</button><button type="button" id="cancel" hidden>Cancelar</button></div></form><p id="message" role="status"></p><p id="storage" role="status"></p></section><section class="panel"><div class="between"><h2>Mis tareas</h2><select id="filter" aria-label="Filtrar tareas"><option value="all">Todas</option><option value="pending">Pendientes</option><option value="done">Completadas</option></select></div><ul id="tasks"></ul><p id="empty">No hay tareas en esta vista.</p></section><footer>TaskFlow Pro · Desarrollo Full Stack</footer></main><script src="app.js"></script></body></html>
